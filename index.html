<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Task List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>My Task List</h1>
    <p id="summary" class="summary"></p>

    <form id="task-form" class="task-form">
      <input id="task-input" type="text" placeholder="What needs doing?" maxlength="100" autocomplete="off" required />
      <button type="submit">Add task</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">To do</button>
      <button class="filter" data-filter="done">Done</button>
    </div>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden>Nothing here yet. Add your first task above.</p>

    <button id="clear-done" class="clear">Clear finished tasks</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
